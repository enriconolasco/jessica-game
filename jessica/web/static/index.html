<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jéssica — Protótipo</title><link rel="stylesheet" href="/static/style.css"></head>
<body><header><h1>Jéssica</h1><span>prova vertical do motor</span></header>
<main><section id="start" class="card"><h2>Nova partida</h2><label>Seed <input id="seed" type="number" value="20260923"></label><button id="create">Criar partida</button><label>Save <input id="saveId" placeholder="identificador"></label><button id="load">Carregar</button></section>
<section id="game" hidden><div class="toolbar"><strong id="status"></strong><button id="save">Salvar</button></div><div id="message"></div><div class="grid"><section class="card"><h2>Jogadores</h2><div id="players"></div><h2>Unidades</h2><div id="units"></div></section><section class="card"><h2>Ações legais</h2><div id="actions"></div></section><section class="card"><h2>Acontecimentos</h2><div id="events"></div></section></div></section></main>
<script src="/static/app.js"></script></body></html>
