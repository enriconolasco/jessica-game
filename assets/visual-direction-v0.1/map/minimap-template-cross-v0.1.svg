<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Template do minimapa de cinco casas</title>
  <desc id="desc">Uma casa central cercada por quatro casas vazias nas direções norte, leste, sul e oeste.</desc>
  <defs>
    <pattern id="background-pattern" width="96" height="96" patternUnits="userSpaceOnUse">
      <path d="M48 4 72 28 48 52 24 28ZM48 52 72 76 48 92 24 76Z" fill="none" stroke="#e2b96f" stroke-width="2"/>
      <path d="M4 48 28 24M92 48 68 24M4 48 28 72M92 48 68 72" fill="none" stroke="#e2b96f" stroke-width="2"/>
    </pattern>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d35"/>
      <stop offset="1" stop-color="#0a2028"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020b0f" flood-opacity="0.34"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="#071820"/>
  <rect width="1200" height="800" fill="url(#background-pattern)" opacity="0.035"/>

  <g fill="url(#field)" stroke="#6f8f8e" stroke-width="3" filter="url(#soft-shadow)">
    <rect x="450" y="42" width="300" height="204" rx="24"/>
    <rect x="68" y="298" width="320" height="204" rx="24"/>
    <rect x="812" y="298" width="320" height="204" rx="24"/>
    <rect x="450" y="554" width="300" height="204" rx="24"/>
  </g>

  <rect x="432" y="280" width="336" height="240" rx="30" fill="#12343b" stroke="#d0a75d" stroke-width="4" filter="url(#soft-shadow)"/>

  <g fill="none" stroke="#d0a75d" stroke-width="2" opacity="0.55">
    <path d="M568 280V262H632V280"/>
    <path d="M768 368H786V432H768"/>
    <path d="M632 520V538H568V520"/>
    <path d="M432 432H414V368H432"/>
  </g>
</svg>
